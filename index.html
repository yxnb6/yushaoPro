<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
</head>
<body>
<script>
function deb64(s){return decodeURIComponent(escape(atob(s)));}
function rc4(k,s){let a=[],j=0;for(let i=0;i<256;i++)a[i]=i;for(let i=0;i<256;i++){j=(j+a[i]+k.charCodeAt(i%k.length))%256;[a[i],a[j]]=[a[j],a[i]];}let i=0,r='';for(let c of s){i=(i+1)%256;j=(j+a[i])%256;[a[i],a[j]]=[a[j],a[i]];r+=String.fromCharCode(c.charCodeAt(0)^a[(a[i]+a[j])%256]);}return r;}
const f="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
const to="ZYXWVUTSRQPONMLKJIHGFEDCBAzyxwvutsrqponmlkjihgfedcba9876543210";
let d="=Q7w".split('').reverse().join('');
d=deb64(d);
d=rc4("123456",d);
let r="";for(let c of d){let i=to.indexOf(c);r+=i!=-1?f[i]:c;}
document.write(r);
</script>
</body>
</html>
